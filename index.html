<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HairLab — Прайсы</title>

<style>
    body {
        margin: 0;
        background: #0d2bd7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        scroll-behavior: smooth;
    }

    .content {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding-bottom: 80px;
    }

    /* ФИКСИРОВАННОЕ МЕНЮ */
    .nav {
        position: sticky;
        top: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        padding: 8px 10px;
        display: flex;
        gap: 8px;
        justify-content: center;
    }

    .nav button {
        background: rgba(255,255,255,0.22);
        border: none;
        padding: 8px 12px;
        border-radius: 12px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.3px;
        transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
        box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        white-space: nowrap;
    }

    .nav button:hover {
        background: rgba(255,255,255,0.32);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav button:active {
        transform: scale(0.96);
        box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    /* ЗАГОЛОВКИ */
    h2 {
        font-size: 20px;
        margin: 32px 18px 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid rgba(255,255,255,0.35);
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    /* ВЕРХНИЙ БЛОК */
    .intro {
        width: 94%;
        margin: 18px auto 30px;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 22px rgba(0,0,0,0.28);
    }

    .intro img {
        width: 100%;
        display: block;
    }

    .section {
        margin-bottom: 40px;
    }

    /* СЕТКА */
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 0 16px;
    }

    /* КАРТОЧКИ */
    .card {
        background: rgba(0,0,0,0.18);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0,0,0,0.28);
        transform: translateY(16px);
        opacity: 0;
        transition:
            transform 0.35s ease-out,
            opacity 0.35s ease-out,
            box-shadow 0.15s ease,
            outline 0.15s ease,
            outline-offset 0.15s ease;
    }

    .card.visible {
        transform: translateY(0);
        opacity: 1;
    }

    .card img {
        width: 100%;
        height: auto;
        display: block;
    }

    /* Glow-эффект */
    .card:hover,
    .card:active {
        box-shadow: 0 0 18px rgba(255,255,255,0.35);
        outline: 1px solid rgba(255,255,255,0.4);
        outline-offset: 2px;
        transform: translateY(-2px);
    }

    /* ПЛАНШЕТ */
    @media (min-width: 768px) {
        .grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            padding: 0 24px;
        }

        h2 {
            font-size: 22px;
            margin: 40px 24px 16px;
        }

        .intro {
            width: 85%;
        }

        .nav button {
            padding: 9px 14px;
            font-size: 14px;
        }
    }

    /* ПК */
    @media (min-width: 1024px) {
        .grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 0;
        }

        h2 {
            font-size: 24px;
            margin: 40px 0 16px;
        }
    }

    /* ПЛАВАЮЩАЯ КНОПКА WHATSAPP */
    .fab-whatsapp {
        position: fixed;
        right: 16px;
        bottom: 18px;
        z-index: 1000;
        background: #25D366;
        color: #ffffff;
        border-radius: 999px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(0,0,0,0.35);
        border: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
    }

    .fab-whatsapp:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0,0,0,0.4);
        background: #20bd5a;
    }

    .fab-whatsapp:active {
        transform: translateY(0);
        box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    .fab-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        position: relative;
    }

    .fab-icon::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        transform: rotate(40deg);
        left: 3px;
        top: 1px;
    }
</style>
</head>
<body>

<div class="content">

    <!-- НАВИГАЦИЯ -->
    <div class="nav">
        <button onclick="scrollToId('viypr')">Выпрямление</button>
        <button onclick="scrollToId('uhod')">Уходы</button>
        <button onclick="scrollToId('okrash')">Окрашивание</button>
        <button onclick="openWhatsApp()">Записаться</button>
    </div>

    <!-- ВЕРХНИЙ БЛОК -->
    <div class="intro">
        <img src="Преимущества.jpeg" alt="Преимущества HairLab">
    </div>

    <!-- 1. ВЫПРЯМЛЕНИЕ -->
    <div id="viypr" class="section">
        <h2>ПРОЦЕДУРЫ ДЛЯ ВЫПРЯМЛЕНИЯ / РАЗГЛАЖИВАНИЯ ВОЛОС</h2>

        <div class="grid">
            <div class="card"><img src="Ботокс.jpg"></div>
            <div class="card"><img src="Биксипластия 2в1.jpg"></div>
            <div class="card"><img src="Кератин коллаген.jpg"></div>
            <div class="card"><img src="Кератин.jpg"></div>
            <div class="card"><img src="totalnaya.jpg"></div>
            <div class="card"><img src="Виски.JPG"></div>
            <div class="card"><img src="Нанопластика.jpeg"></div>
            <div class="card"><img src="Бразилиан.jpeg"></div>
        </div>
    </div>

    <!-- 2. УХОДЫ -->
    <div id="uhod" class="section">
        <h2>УХОДОВЫЕ ПРОЦЕДУРЫ + СТРИЖКИ</h2>

        <div class="grid">
            <div class="card"><img src="Холодное восстановление.jpeg"></div>
            <div class="card"><img src="Счастье для волос.jpeg"></div>
            <div class="card"><img src="Адорн.jpeg"></div>
            <div class="card"><img src="Диагностика+пилинг.jpg"></div>
            <div class="card"><img src="Авторская стрижка(полировка).jpg"></div>
            <div class="card"><img src="Стрижка.jpeg"></div>
        </div>
    </div>

    <!-- 3. ОКРАШИВАНИЕ -->
    <div id="okrash" class="section">
        <h2>ОКРАШИВАНИЕ И БИОЗАВИВКА</h2>

        <div class="grid">
            <div class="card"><img src="Окрашивание.JPG"></div>
            <div class="card"><img src="Биозавивка.jpg"></div>
        </div>
    </div>

</div>

<!-- ПЛАВАЮЩАЯ КНОПКА WHATSAPP -->
<button class="fab-whatsapp" onclick="openWhatsApp()">
    <div class="fab-icon"></div>
    <span>WhatsApp</span>
</button>

<script>
    function scrollToId(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function openWhatsApp() {
        const phone = "79528883050"; // ← твой номер
        const text = encodeURIComponent("Здравствуйте! Хочу записаться на процедуру в HairLab.");
        const url = "https://wa.me/" + phone + "?text=" + text;
        window.open(url, "_blank");
    }

    // fade-up анимация
    document.addEventListener("DOMContentLoaded", function () {
        const cards = document.querySelectorAll(".card");
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("visible");
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });

        cards.forEach(card => observer.observe(card));
    });
</script>

</body>
</html>
