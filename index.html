<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HairLab — Прайсы</title>

<style>
    body {
        margin: 0;
        background: linear-gradient(180deg, #2f53ff 0%, #5d7dff 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #ffffff;
        scroll-behavior: smooth;
    }

    .content {
        width: 100%;
        max-width: 920px;
        margin: 0 auto;
        padding-bottom: 90px;
    }

    /* ===== GLASS НАВИГАЦИЯ ===== */
    .nav {
        position: sticky;
        top: 0;
        z-index: 999;
        margin-top: 6px;
        padding: 8px 10px;
        display: flex;
        gap: 8px;
        justify-content: center;

        background: rgba(5, 12, 60, 0.55);
        border-radius: 999px;
        box-shadow: 0 12px 26px rgba(0,0,0,0.35);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid rgba(255,255,255,0.25);
    }

    .nav button {
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.3px;
        transition: 0.15s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        white-space: nowrap;
    }

    .nav button:hover {
        background: rgba(255,255,255,0.18);
        border-color: rgba(255,255,255,0.35);
        box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    }

    .nav button:active {
        transform: scale(0.95);
    }

    /* ЗАГОЛОВКИ */
    h2 {
        font-size: 20px;
        margin: 32px 18px 14px;
        padding-bottom: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    /* Анимация заголовков */
    .title {
        opacity: 0;
        transform: translateY(16px);
        position: relative;
        transition: 0.45s ease-out;
    }

    .title.visible-title {
        opacity: 1;
        transform: translateY(0);
    }

    .title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        height: 2px;
        width: 0;
        background: rgba(255,255,255,0.4);
        transition: width 0.45s ease-out 0.25s;
    }

    .title.visible-title::after {
        width: 100%;
    }

    /* Блок преимущества */
    .intro {
        width: 94%;
        margin: 18px auto 30px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 14px 30px rgba(0,0,0,0.3);
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        cursor: pointer;
    }

    .intro img {
        width: 100%;
        display: block;
    }

    /* СЕТКА */
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 0 16px;
    }

    /* КАРТОЧКИ */
    .card {
        background: rgba(255,255,255,0.08);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 26px rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(16px) saturate(150%);
        -webkit-backdrop-filter: blur(16px) saturate(150%);

        transform: translateY(18px);
        opacity: 0;
        transition: 0.35s ease-out;
        cursor: pointer;
    }

    .card.visible {
        transform: translateY(0);
        opacity: 1;
    }

    .card img {
        width: 100%;
        display: block;
    }

    .card:hover {
        box-shadow: 0 16px 36px rgba(0,0,0,0.55), 0 0 16px rgba(185, 215, 255, 0.9);
        transform: translateY(-3px);
        outline: 1px solid rgba(195,220,255,0.8);
        outline-offset: 2px;
    }

    /* ПЛАВАЮЩЕЕ МЕНЮ */
    .fab-wrapper {
        position: fixed;
        right: 16px;
        bottom: 18px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
    }

    .fab-menu {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 4px;
    }

    .fab-menu.open {
        display: flex;
    }

    .fab-option {
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        cursor: pointer;
        min-width: 130px;
        box-shadow: 0 10px 22px rgba(0,0,0,0.5);
    }

    .whatsapp { background: #25D366; }
    .telegram { background: #229ED9; }
    .instagram {
        background: radial-gradient(circle at 30% 30%,
            #fdf497 0, #fdf497 8%, #fd5949 45%, #d6249f 60%, #285AEB 100%);
    }

    .fab-main {
        background: #25D366;
        color: #ffffff;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        display: flex;
        gap: 8px;
        box-shadow: 0 12px 26px rgba(0,0,0,0.6);
        transition: 0.12s ease;
    }

    .fab-main:hover {
        transform: translateY(-2px);
        background: #20bd5a;
    }

    .fab-icon {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        position: relative;
    }

    .fab-icon::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        transform: rotate(40deg);
        left: 3px;
        top: 1px;
    }

    /* МОДАЛЬНАЯ КАРТИНКА */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 16px;
    }

    .modal-overlay.open {
        display: flex;
    }

    .modal-overlay img {
        max-width: 100%;
        max-height: 90vh;
        border-radius: 18px;
        box-shadow:
            0 20px 40px rgba(0,0,0,0.7),
            0 0 24px rgba(200,220,255,0.9);
    }
</style>
</head>
<body>

<div class="content">

    <!-- НАВИГАЦИЯ -->
    <div class="nav">
        <button onclick="scrollToId('viypr')">Выпрямление</button>
        <button onclick="scrollToId('uhod')">Уходы</button>
        <button onclick="scrollToId('okrash')">Окрашивание</button>
    </div>

    <!-- ПРЕИМУЩЕСТВА -->
    <div class="intro zoomable">
        <img src="Преимущества.jpeg" alt="Преимущества HairLab">
    </div>

    <!-- ВЫПРЯМЛЕНИЕ -->
    <div id="viypr" class="section">
        <h2 class="title">ПРОЦЕДУРЫ ДЛЯ ВЫПРЯМЛЕНИЯ / РАЗГЛАЖИВАНИЯ ВОЛОС</h2>

        <div class="grid">
            <div class="card"><img src="Ботокс.jpg" alt=""></div>
            <div class="card"><img src="Биксипластия 2в1.jpg" alt=""></div>
            <div class="card"><img src="Кератин коллаген.jpg" alt=""></div>
            <div class="card"><img src="Кератин.jpg" alt=""></div>
            <div class="card"><img src="totalnaya.jpg" alt=""></div>
            <div class="card"><img src="Виски.JPG" alt=""></div>
            <div class="card"><img src="Нанопластика.jpeg" alt=""></div>
            <div class="card"><img src="Бразилиан.jpeg" alt=""></div>
        </div>
    </div>

    <!-- УХОДЫ -->
    <div id="uhod" class="section">
        <h2 class="title">УХОДЫ + СТРИЖКИ</h2>

        <div class="grid">
            <div class="card"><img src="Холодное восстановление.jpeg" alt=""></div>
            <div class="card"><img src="Счастье для волос.jpeg" alt=""></div>
            <div class="card"><img src="Адорн.jpeg" alt=""></div>
            <div class="card"><img src="Диагностика+пилинг.jpg" alt=""></div>
            <div class="card"><img src="Авторская стрижка(полировка).jpg" alt=""></div>
            <div class="card"><img src="Стрижка.jpeg" alt=""></div>
        </div>
    </div>

    <!-- ОКРАШИВАНИЕ -->
    <div id="okrash" class="section">
        <h2 class="title">ОКРАШИВАНИЕ И БИОЗАВИВКА</h2>

        <div class="grid">
            <div class="card"><img src="Окрашивание.JPG" alt=""></div>
            <div class="card"><img src="Биозавивка.jpg" alt=""></div>
        </div>
    </div>

</div>

<!-- МЕНЮ "ЗАПИСАТЬСЯ" -->
<div id="fabWrapper" class="fab-wrapper">
    <div id="fabMenu" class="fab-menu">
        <button class="fab-option whatsapp" onclick="openWhatsApp()">WhatsApp</button>
        <button class="fab-option telegram" onclick="openTelegram()">Telegram</button>
        <button class="fab-option instagram" onclick="openInstagram()">Instagram</button>
    </div>

    <button id="fabMain" class="fab-main">
        <div class="fab-icon"></div>
        <span>Записаться</span>
    </button>
</div>

<!-- МОДАЛЬНОЕ УВЕЛИЧЕНИЕ КАРТОК -->
<div id="imageModal" class="modal-overlay">
    <img id="modalImage" src="" alt="">
</div>

<script>
    function scrollToId(id) {
        document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }

    function openWhatsApp() {
        const phone = "79528883050";
        const text = encodeURIComponent("Здравствуйте! Хочу записаться в HairLab.");
        window.open("https://wa.me/" + phone + "?text=" + text, "_blank");
    }

    function openTelegram() {
        window.open("https://t.me/hairlab_tomsk", "_blank");
    }

    function openInstagram() {
        window.open("https://instagram.com/hairlab_", "_blank");
    }

    document.addEventListener("DOMContentLoaded", function () {

        /* Появление карточек */
        const cards = document.querySelectorAll(".card");
        const cardObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add("visible");
                    obs.unobserve(e.target);
                }
            });
        }, { threshold: 0.2 });

        cards.forEach(c => cardObserver.observe(c));

        /* Анимация заголовков */
        const titles = document.querySelectorAll(".title");
        const titleObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add("visible-title");
                    obs.unobserve(e.target);
                }
            });
        }, { threshold: 0.2 });

        titles.forEach(t => titleObserver.observe(t));

        /* Увеличение картинок */
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");

        document.querySelectorAll(".card img, .intro img").forEach(img => {
            img.addEventListener("click", function () {
                modalImage.src = this.src;
                modal.classList.add("open");
                document.body.style.overflow = "hidden";
            });
        });

        modal.addEventListener("click", function () {
            modal.classList.remove("open");
            document.body.style.overflow = "";
        });

        /* Кнопка "Записаться" */
        const fabWrapper = document.getElementById("fabWrapper");
        const fabMain = document.getElementById("fabMain");
        const fabMenu = document.getElementById("fabMenu");

        fabMain.addEventListener("click", function (e) {
            e.stopPropagation();
            fabMenu.classList.toggle("open");
        });

        document.addEventListener("click", function (e) {
            if (!fabWrapper.contains(e.target)) {
                fabMenu.classList.remove("open");
            }
        });
    });
</script>

</body>
</html>
